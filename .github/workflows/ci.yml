name: Orca OS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Run host-side integration tests
        run: make test
      - name: Validate shell syntax
        run: |
          find build cli services tools tests vm -type f -print0 | xargs -0 -n1 bash -n
