[Distribution]
Distribution=debian
Release=bookworm
Architecture=x86_64

[Output]
Format=disk
Output=orca-os-x86_64.raw
ManifestFormat=json

[Content]
Bootable=yes
Hostname=orca-node
KernelCommandLine=console=ttyS0
Packages=
        systemd
        systemd-sysv
        systemd-boot-efi
        linux-image-amd64
        openssh-server
        sudo
        ca-certificates
        qemu-guest-agent
        iproute2
        procps
        bash

[Runtime]
CPUs=2
RAM=2G
Firmware=uefi
RuntimeNetwork=user
