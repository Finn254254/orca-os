[Distribution]
Distribution=debian
Release=bookworm
Architecture=x86-64

[Output]
Format=disk
Output=orca-os-x86_64
ManifestFormat=json

[Content]
Bootable=yes
Hostname=orca-node
Autologin=yes
Locale=C.UTF-8
Keymap=us
Timezone=UTC
RootShell=/bin/bash
RootPassword=hashed:
KernelCommandLine=console=ttyS0
Packages=
        systemd
        systemd-sysv
        systemd-boot-efi
        linux-image-amd64
        openssh-server
        sudo
        ca-certificates
        curl
        qemu-guest-agent
        iproute2
        procps
        bash
        python3

[Runtime]
CPUs=2
RAM=2G
Firmware=uefi
RuntimeNetwork=user
