[Distribution]
Distribution=debian
Release=bookworm
Architecture=x86_64

[Output]
Format=disk
Output=orca-os-x86_64.raw

[Content]
Bootable=yes
Hostname=orca-node
Packages=
        systemd
        systemd-sysv
        linux-image-amd64
        openssh-server
        sudo
        ca-certificates
        qemu-guest-agent
        iproute2
        procps
        bash

[HostOnly]
Initrds=no
